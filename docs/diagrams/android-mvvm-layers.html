<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capas del Cliente Android · Layer Stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Android Architecture · Diagram Design</p>
    <h1>Capas de presentación, estado y motor clínico en Android</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="android-mvvm-title android-mvvm-desc">
      <title id="android-mvvm-title">Capas de presentación, estado y motor clínico en Android</title>
      <desc id="android-mvvm-desc">Diagrama de arquitectura de la aplicación Android con PreConsultaScreen en Jetpack Compose, servicios de voz del sistema, estado reactivo de 3 pasos y GemmaLocalEngine.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: Capa de Datos y Red (drawn before arrows and nodes) -->
      <rect x="644" y="104" width="316" height="272" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="744" y="108" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="802" y="117" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">CAPA DE DATOS</text>

      <!-- Arrows first (behind boxes) -->
      <line x1="112" y1="268" x2="112" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="176" x2="268" y2="176" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="436" y1="176" x2="496" y2="176" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- GemmaLocalEngine fan-out to REST Client and Offline Rules -->
      <line x1="624" y1="176" x2="684" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 560,208 V 300 Q 560,308 568,308 H 684"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="120" y="232" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="146" y="241" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STT/TTS</text>

      <rect x="214" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="238" y="165" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENTOS</text>

      <rect x="442" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="466" y="165" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COROUT</text>

      <rect x="630" y="156" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="654" y="165" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="576" y="288" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="606" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FALLBACK</text>

      <!-- Node 1: PreConsultaScreen (Compose UI) -->
      <rect x="40" y="144" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="144" width="168" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="48" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="62" y="161" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="200" y="204" fill="rgba(235,108,54,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="124" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PreConsultaScreen</text>
      <text x="124" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MainActivity.kt</text>

      <!-- Node 2: Android Speech & Share Intents -->
      <rect x="40" y="268" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="268" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="285" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OS</text>
      <text x="124" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Servicios Android</text>
      <text x="124" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Speech · TTS · Share</text>

      <!-- Node 3: Estado Reactivo Compose -->
      <rect x="268" y="144" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="268" y="144" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="276" y="152" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="294" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="352" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Estado de 3 Pasos</text>
      <text x="352" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1-3 preg · respuestas</text>

      <!-- Node 4: GemmaLocalEngine -->
      <rect x="496" y="144" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="496" y="144" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="504" y="152" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="520" y="161" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
      <text x="616" y="204" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="560" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GemmaEngine</text>
      <text x="560" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Dispatchers.IO</text>

      <!-- Node 5: Cliente REST HttpURLConnection -->
      <rect x="684" y="144" width="252" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="144" width="252" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="692" y="152" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="710" y="161" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>
      <text x="810" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cliente Cloud JSON</text>
      <text x="810" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HttpURLConnection · /api/telemed</text>

      <!-- Node 6: Plantillas Clínicas Offline -->
      <rect x="684" y="276" width="252" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="684" y="276" width="252" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="692" y="284" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="710" y="293" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="810" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Motor Clínico Local</text>
      <text x="810" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OPQRST · SOAP · ISBAR</text>

      <!-- Legend strip -->
      <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Capa UI Compose</text>

      <rect x="196" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="216" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Estado / cliente REST</text>

      <rect x="364" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="384" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Repositorio</text>

      <rect x="484" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="504" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Motor local</text>

      <rect x="608" y="436" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="628" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Android OS</text>

      <line x1="728" y1="442" x2="756" y2="442" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="764" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flujo reactivo</text>
    </svg>
  </div>
</body>
</html>

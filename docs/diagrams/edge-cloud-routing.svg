<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edge-cloud-title edge-cloud-desc" id="edge-cloud-routing-root">
      <title id="edge-cloud-title">Enrutamiento híbrido online y offline en Android</title>
      <desc id="edge-cloud-desc">Arquitectura del cliente Android mostrando captura de voz nativa, sanitización local de PII y enrutamiento resiliente entre la API productiva en Vercel y el motor local offline Gemma 4 E2B.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #edge-cloud-routing-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #edge-cloud-routing-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="edge-cloud-routing-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="edge-cloud-routing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="edge-cloud-routing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="edge-cloud-routing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#edge-cloud-routing-dots)" opacity="0.55"/>

      <!-- Zone: Inferencia Híbrida (drawn before arrows and nodes) -->
      <rect x="524" y="104" width="224" height="272" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="580" y="108" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="117" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">RUTEO RESILIENTE</text>

      <!-- Arrows first (behind boxes) -->
      <line x1="184" y1="240" x2="244" y2="240" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#edge-cloud-routing-arrow-accent)"/>

      <!-- Redactor PII to Cloud API (top) and Local Offline Engine (bottom) -->
      <path d="M 404,224 H 460 Q 468,224 468,216 V 176 Q 468,168 476,168 H 544"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#edge-cloud-routing-arrow-link)"/>
      <path d="M 404,256 H 460 Q 468,256 468,264 V 304 Q 468,312 476,312 H 544"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#edge-cloud-routing-arrow)"/>

      <!-- Cloud API and Local Offline Engine converge into UI Step 3 -->
      <path d="M 728,168 H 768 Q 776,168 776,176 V 216 Q 776,224 784,224 H 808"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#edge-cloud-routing-arrow-accent)"/>
      <path d="M 728,312 H 768 Q 776,312 776,304 V 264 Q 776,256 784,256 H 808"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#edge-cloud-routing-arrow)"/>

      <!-- Arrow labels -->
      <rect x="190" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="214" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VOZ ES</text>

      <rect x="476" y="148" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="157" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONLINE</text>

      <rect x="476" y="320" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OFFLINE</text>

      <rect x="748" y="148" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="774" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>

      <rect x="748" y="320" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="774" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>

      <!-- Node 1: Captura Voz Android -->
      <rect x="40" y="208" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="216" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="64" y="225" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STT</text>
      <text x="112" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Voz Nativa</text>
      <text x="112" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RecognizerIntent</text>

      <!-- Node 2: GemmaLocalEngine PII (Focal Coral) -->
      <rect x="244" y="208" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="244" y="208" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="252" y="216" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="268" y="225" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="396" y="268" fill="#eb6c36" fill-opacity="0.10" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="324" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Filtro Local PII</text>
      <text x="324" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">redactLocalPii()</text>

      <!-- Node 3: Backend Cloud Vercel -->
      <rect x="544" y="136" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="136" width="184" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="552" y="144" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="570" y="153" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
      <text x="720" y="196" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="636" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Cloud Telemed</text>
      <text x="636" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gemma 4 + Gemini 3.8</text>

      <!-- Node 4: Motor Local Offline -->
      <rect x="544" y="280" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="280" width="184" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="552" y="288" width="36" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="570" y="297" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
      <text x="636" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Motor Offline E2B</text>
      <text x="636" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">buildOfflineDeliverables()</text>

      <!-- Node 5: UI Compose Resultados -->
      <rect x="808" y="208" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="808" y="208" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="816" y="216" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="830" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="884" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Doble Entregable</text>
      <text x="884" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Alerta + SOAP/ISBAR</text>

      <!-- Legend strip -->
      <line x1="40" y1="404" x2="960" y2="404" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="436" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Privacidad en dispositivo</text>

      <rect x="216" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="236" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">UI Jetpack Compose</text>

      <rect x="372" y="436" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="392" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inferencia cloud</text>

      <rect x="512" y="436" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="532" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respaldo offline</text>

      <line x1="656" y1="442" x2="684" y2="442" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#edge-cloud-routing-arrow-link)"/>
      <text x="692" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTPS POST</text>

      <line x1="788" y1="442" x2="816" y2="442" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#edge-cloud-routing-arrow)"/>
      <text x="824" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Modo sin red</text>
    </svg>
